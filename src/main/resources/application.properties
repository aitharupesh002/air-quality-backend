# Default profile: local development using an in-memory H2 database.
# No setup needed — just run the app and it works out of the box.

spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:aqms;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allow the local Vite dev server by default. Override with env var
# APP_CORS_ALLOWED_ORIGINS on Render once the frontend is deployed.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
