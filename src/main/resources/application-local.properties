# Local profile: MySQL running on your own laptop (MySQL Installer / port 3306).
# Activate with: SPRING_PROFILES_ACTIVE=local  (or -Dspring-boot.run.profiles=local)
#
# Only the password is required as an env var, so it never lands in Git:
#   DB_PASSWORD   the root password you set when installing MySQL
# Optional overrides (defaults shown):
#   DB_USER=root   DB_NAME=aqms
#
# createDatabaseIfNotExist=true creates the "aqms" database on first run,
# and Hibernate (ddl-auto=update) creates the air_quality_records table.

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:aqms}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
