# Production profile: MySQL hosted on Aiven.
# Activate with the env var SPRING_PROFILES_ACTIVE=prod on Render.
#
# Set these four env vars on Render (values come from your Aiven MySQL
# service's "Connection details" page):
#   DB_HOST       e.g. mysql-xxxxxxx-yourproject.aivencloud.com
#   DB_PORT       e.g. 12345
#   DB_NAME       e.g. defaultdb
#   DB_USER       e.g. avnadmin
#   DB_PASSWORD   the Aiven-generated password
#
# Aiven requires SSL, which sslMode=REQUIRED below enables.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Set this on Render to your deployed frontend URL, e.g.
# https://your-frontend.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
